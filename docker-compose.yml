services:
  mysql:
    image: mysql:8.0
    container_name: ghw-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-galaxy_heritage_world}
      MYSQL_USER: ${DB_USER:-ghw_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ghw_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ghw-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghw-backend
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: mysql://${DB_USER:-ghw_user}:${DB_PASSWORD:-ghw_password}@mysql:3306/${DB_NAME:-galaxy_heritage_world}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-secret-key-ghw-access-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-secret-key-ghw-refresh-2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ghw-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
      API_INTERNAL_URL: http://backend:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
