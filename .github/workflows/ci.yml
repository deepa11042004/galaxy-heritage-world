name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: galaxy_heritage_world
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Migrate DB
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/galaxy_heritage_world
        run: |
          npm --workspace=backend run db:generate
          npm --workspace=backend run db:push
          npm --workspace=backend run db:seed

      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/galaxy_heritage_world
        run: npm --workspace=backend test

      - name: Build Express API
        run: npm --workspace=backend run build

      - name: Build Next.js Web Application
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
        run: npm --workspace=frontend run build
